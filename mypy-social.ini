[mypy]
plugins = mypy_django_plugin.main
strict = True
follow_imports = silent
ignore_missing_imports = True
files = apps/social/planner.py, apps/social/planner_ai.py, apps/social/planner_views.py, apps/social/editorial.py
exclude = migrations|tests.py

[mypy.plugins.django-stubs]
django_settings_module = clearcodereading.settings

[mypy-apps.social.migrations.*]
ignore_errors = True
