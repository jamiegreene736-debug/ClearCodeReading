[mypy]
plugins = mypy_django_plugin.main
strict = True
follow_imports = silent
ignore_missing_imports = True
files = apps/social/reels.py, apps/social/reel_views.py, apps/social/reel_publishing.py, apps/social/prompts.py, apps/social/designs.py, apps/social/design_views.py, apps/social/drafts.py, apps/social/categories.py, apps/social/category_views.py, apps/social/reporting.py, apps/social/report_views.py, apps/social/insights_api.py, apps/social/insights.py, apps/social/signals.py, apps/social/media.py, apps/social/carousel_ai.py, apps/social/navigation.py, apps/social/templatetags/social_navigation.py, apps/social/schedule_views.py, apps/social/planner.py, apps/social/planner_ai.py, apps/social/planner_views.py, apps/social/editorial.py, apps/blog/planner.py, apps/blog/planner_ai.py, apps/blog/planner_views.py, apps/blog/promotion.py
exclude = migrations|tests.py

[mypy.plugins.django-stubs]
django_settings_module = clearcodereading.settings

[mypy-apps.social.migrations.*]
ignore_errors = True
