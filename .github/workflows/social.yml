name: Social content checks
on:
  pull_request:
    paths:
      - 'apps/social/**'
      - 'apps/blog/**'
      - 'templates/social/**'
      - 'templates/portal/_header.html'
      - 'mypy-social.ini'
      - '.github/workflows/social.yml'
  push:
    branches: [main]
    paths:
      - 'apps/social/**'
      - 'apps/blog/**'
      - 'templates/social/**'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearcode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clearcode_test
      CRM_EMAIL_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: pip install -r requirements-crm-email-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check apps/social/planner.py apps/social/planner_ai.py apps/social/planner_views.py apps/social/editorial.py apps/social/test_planner.py apps/social/schedule_views.py apps/social/test_schedule_views.py apps/blog/planner.py apps/blog/planner_ai.py apps/blog/planner_views.py apps/blog/promotion.py apps/blog/test_planner.py
      - run: ruff format --check apps/social/planner.py apps/social/planner_ai.py apps/social/planner_views.py apps/social/editorial.py apps/social/test_planner.py apps/social/schedule_views.py apps/social/test_schedule_views.py apps/blog/planner.py apps/blog/planner_ai.py apps/blog/planner_views.py apps/blog/promotion.py apps/blog/test_planner.py
      - run: mypy --config-file mypy-social.ini
      - run: python manage.py test apps.social apps.blog apps.core.test_marketing --noinput
