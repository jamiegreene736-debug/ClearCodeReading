name: CRM email checks
on:
  pull_request:
    paths:
      - 'apps/crm_email/**'
      - 'apps/crm/**'
      - 'apps/users/**'
      - 'templates/crm/**'
      - 'clearcodereading/**'
      - 'requirements*.txt'
      - 'mypy-crm-email.ini'
      - '.github/workflows/crm-email.yml'
  push:
    branches: [main]
    paths:
      - 'apps/crm_email/**'
      - 'requirements*.txt'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clearcode_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/clearcode_test
      CRM_EMAIL_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - run: pip install -r requirements-crm-email-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: ruff check apps/crm_email
      - run: ruff format --check apps/crm_email
      - run: mypy --config-file mypy-crm-email.ini
      - run: python manage.py test --noinput
