{% load static %}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>{% block title %}Account setup{% endblock %} | ClearCode Reading</title><link rel="icon" href="/assets/logo/cc-favicon-gold-teal-32.png"><link rel="stylesheet" href="{% static 'css/clearcode-tailwind.css' %}">
<style>body{margin:0;background:#f7f2ea;color:#213343;font:16px/1.6 system-ui,sans-serif}main{max-width:960px;margin:32px auto;padding:0 20px}h1{font-size:32px;line-height:1.2}h2{font-size:22px}.card{padding:24px;background:white;border:1px solid #cbd6e2;border-radius:16px;margin:20px 0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:650}input,select{width:100%;padding:12px;border:1px solid #8298a5;border-radius:8px;font:inherit;box-sizing:border-box}main button,.button{display:inline-block;background:#1a7a7a;color:white;padding:12px 20px;border:0;border-radius:8px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.secondary{background:#e5f5f3;color:#213343}a{color:#1a7a7a}.helptext,.subtle{color:#526674}.errorlist,[role=alert]{color:#9b2929}.receipt{border-top:1px solid #cbd6e2;padding:16px 0;overflow-wrap:anywhere}:focus-visible{outline:3px solid #f5a623;outline-offset:3px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}.card{padding:18px}}</style></head>
<body>{% if request.user.is_authenticated %}{% include "portal/_header.html" %}{% else %}<header class="card"><a href="/">ClearCode Reading</a></header>{% endif %}<main>{% for message in messages %}<p role="status" class="card">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
