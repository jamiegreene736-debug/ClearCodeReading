{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Program{% endblock %} | ClearCode Reading</title>
  <link rel="icon" href="/assets/logo/cc-favicon-gold-teal-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/logo/cc-apple-touch-icon-gold-teal-180.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/clearcode-tailwind.css' %}">
  <style>
    .focus-ring:focus-visible { outline: 4px solid rgba(245, 166, 35, .75); outline-offset: 3px; }
    .page-bg {
      background:
        radial-gradient(circle at 12% 12%, rgba(245, 166, 35, .20), transparent 24%),
        radial-gradient(circle at 86% 16%, rgba(46, 184, 184, .12), transparent 24%),
        linear-gradient(135deg, #F7F2EA 0%, #A8CFC4 48%, #E8D5B0 100%);
    }
  </style>
</head>
<body class="page-bg min-h-screen font-sans text-ink antialiased">
  {% include "portal/_header.html" %}
  <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
    {% if messages %}
      <div class="mb-6">{% include "_site_messages.html" with site_messages_layout="block" %}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
