{% extends "portal/onboarding_base.html" %}
{% block extra_head %}
<style>
.reader-card {max-width:44rem;margin:auto;background:white;padding:clamp(1.25rem,4vw,2.5rem);border:1px solid #cbd6e2;border-radius:1rem}
.reader-card h1 {margin:.35rem 0 1rem}.reader-card h2,.reader-card legend {font-size:1.2rem;font-weight:700;margin:0 0 .5rem}
.reader-card fieldset {border:0;border-top:1px solid #cedbd8;padding:1.25rem 0;margin:1rem 0 0}
.reader-card .choice {display:flex;align-items:baseline;gap:.75rem;margin:.75rem 0;font-weight:450}
.reader-card input[type=checkbox] {width:1.1rem;height:1.1rem;flex:none}
.reader-card textarea {width:100%;border:1px solid #8298a5;border-radius:8px;padding:.75rem;font:inherit}
.reader-card footer {display:flex;align-items:center;gap:1.25rem;margin-top:1.5rem}
.reader-card .step {font-weight:650;color:#196461}.reader-card .field {margin:.75rem 0}
@media print {body>header,.reader-card footer,#site-confirmation {display:none}}
</style>
{% endblock %}
