<nav class="mb-6 flex flex-wrap gap-2" aria-label="Social marketing">
  <a href="{% url 'social:queue' %}?tab=drafts" {% if nav.active == 'drafts' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'drafts' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">Drafts</a>
  <a href="{% url 'social:queue' %}?tab=scheduled" {% if nav.active == 'scheduled' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'scheduled' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">Scheduled</a>
  <a href="{% url 'social:queue' %}?tab=posted" {% if nav.active == 'posted' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'posted' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">Posted</a>
  <a href="{% url 'social:queue' %}?tab=attention" {% if nav.active == 'attention' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'attention' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">Needs attention</a>
  <a href="{% url 'social:planner' %}?return_to={{ nav.origin }}" {% if nav.active == 'planner' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'planner' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">AI content plan</a>
  <a href="{% url 'social:settings' %}?return_to={{ nav.link_origin }}" {% if nav.active == 'settings' or nav.active == 'choose_page' %}aria-current="page"{% endif %} class="focus-ring rounded-full px-4 py-2 text-sm font-black ring-1 ring-ink/10 {% if nav.active == 'settings' or nav.active == 'choose_page' %}bg-ink text-white{% else %}bg-white text-deepTeal{% endif %}">Settings</a>
</nav>
{% if nav.active != 'drafts' and nav.active != 'scheduled' and nav.active != 'posted' and nav.active != 'attention' %}
  <a href="{{ nav.back_url }}" data-testid="social-back" class="focus-ring mb-4 inline-flex rounded-full bg-white px-4 py-2 text-sm font-black text-deepTeal ring-1 ring-ink/10">← Back to {{ nav.back_label }}</a>
{% endif %}
