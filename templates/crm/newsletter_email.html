<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ campaign.subject }}</title>
</head>
<body style="margin:0;background:#F7F2EA;color:#0F2B35;font-family:Arial,sans-serif;">
  {% if campaign.preview_text %}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{ campaign.preview_text }}</div>{% endif %}
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#F7F2EA;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background:#ffffff;border-radius:20px;overflow:hidden;">
          <tr><td style="background:#0F2B35;color:#ffffff;padding:24px 32px;font-size:22px;font-weight:bold;">ClearCode Reading</td></tr>
          <tr>
            <td style="padding:32px;font-size:17px;line-height:1.65;">
              <h1 style="margin:0 0 24px;font-size:28px;line-height:1.2;">{{ campaign.subject }}</h1>
              {{ campaign.body|linebreaks }}
            </td>
          </tr>
          <tr>
            <td style="background:#A8CFC4;padding:20px 32px;font-size:13px;line-height:1.5;">
              You received this message because you subscribed to ClearCode Reading updates.
              <a href="{{ unsubscribe_url }}" style="color:#0F2B35;font-weight:bold;">Unsubscribe</a>.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
