{% load inventory_email %}
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="margin:0;
             background:#f5f8fa;
             font-family:Arial,sans-serif;
             color:#213343"><div style="max-width:600px;
            margin:32px auto;
            padding:32px;
            background:white;
            border-top:5px solid #1a7a7a"><img src="{% inventory_logo_url %}" alt="ClearCode Reading" width="240" style="display:block;width:240px;max-width:100%;height:auto;margin-bottom:24px"><h1 style="font-size:24px">{{ email.subject }}</h1>{% if email.action_url %}{{ email.body|before_action|linebreaks }}<p style="margin:28px 0"><a href="{{ email.action_url }}"
   style="display:inline-block;
          background:#1a7a7a;
          color:white;
          padding:14px 22px;
          text-decoration:none;
          border-radius:6px">{{ email.action_label }}</a></p>{{ email.body|after_action|linebreaks }}{% else %}{{ email.body|linebreaks }}{% endif %}<p style="font-size:12px;color:#5c6f7f">A clear next step for your family.</p></div></body></html>
